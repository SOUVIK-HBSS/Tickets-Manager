<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-primary: #0a0a0a; --bg-secondary: #111827; --bg-tertiary: #1a1a2e; --text-primary: #e9ecef; --text-secondary: #868e96; --accent: #da77f2; --accent-hover: #c061de; --border: #2d2d44; }
        body { background: var(--bg-primary); color: var(--text-primary); font-family: 'Segoe UI', Arial, sans-serif; }
        .sidebar { background: var(--bg-secondary); border-right: 1px solid var(--border); }
        .nav-item { padding: 10px 16px; cursor: pointer; transition: all 0.2s; border-left: 3px solid transparent; font-size: 14px; }
        .nav-item:hover { background: var(--bg-tertiary); }
        .nav-item.active { background: var(--bg-tertiary); border-left-color: var(--accent); }
        .btn { padding: 6px 12px; border-radius: 4px; cursor: pointer; border: none; font-weight: 500; font-size: 13px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); }
        .input { background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-primary); padding: 6px 10px; border-radius: 4px; font-size: 13px; }
        .input:focus { outline: none; border-color: var(--accent); }
        .modal { background: rgba(0,0,0,0.8); position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal.show { display: flex; }
        .modal-content { background: var(--bg-secondary); border-radius: 8px; padding: 20px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .badge { padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; text-transform: uppercase; }
        .tab-btn { padding: 8px 16px; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; font-size: 13px; white-space: nowrap; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 16px; border-radius: 6px; background: var(--accent); color: white; transform: translateY(100px); transition: transform 0.3s; font-size: 13px; }
        .toast.show { transform: translateY(0); }
        
        .ticket-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .ticket-table th { padding: 8px 6px; text-align: left; font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; color: var(--text-secondary); border-bottom: 2px solid var(--accent); position: relative; user-select: none; white-space: nowrap; }
        .ticket-table th:hover { background: var(--bg-tertiary); }
        .ticket-table td { padding: 4px 6px; border-bottom: 1px solid var(--border); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ticket-table tr:hover td { background: var(--bg-tertiary); }
        
        .filter-row { display: flex; gap: 4px; padding: 6px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
        .filter-input { }
        
        .resize-handle { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; cursor: col-resize; background: transparent; }
        .resize-handle:hover { background: var(--accent); }
        
        .filter-dropdown { position: relative; display: inline-block; }
        .filter-dropdown-content { display: none; position: absolute; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 4px; padding: 8px; max-height: 200px; overflow-y: auto; z-index: 10; min-width: 150px; }
        .filter-dropdown:hover .filter-dropdown-content { display: block; }
        .filter-option { display: flex; align-items: center; gap: 4px; padding: 4px; font-size: 12px; }
        .filter-option:hover { background: var(--bg-tertiary); }
    </style>
</head>
<body class="h-screen flex">
    <div class="sidebar w-56 flex-shrink-0 flex flex-col">
        <div class="p-3 border-b border-[#2d2d44]">
            <h1 class="text-lg font-bold text-[#da77f2]"><i class="fas fa-ticket-alt mr-2"></i>Tickets</h1>
        </div>
        <div class="flex-1 overflow-y-auto py-1">
            <div class="nav-item active" data-view="tickets"><i class="fas fa-list mr-2 w-4"></i>All Tickets</div>
            <div class="nav-item" data-view="import"><i class="fas fa-file-import mr-2 w-4"></i>Import</div>
            <div class="nav-item" data-view="generate"><i class="fas fa-file-export mr-2 w-4"></i>Generate</div>
            <div class="nav-item" data-view="gsheet"><i class="fas fa-google mr-2 w-4"></i>Projects</div>
            <div class="nav-item" data-view="rawpaste"><i class="fas fa-paste mr-2 w-4"></i>Raw Data</div>
            <div class="nav-item" data-view="settings"><i class="fas fa-cog mr-2 w-4"></i>Settings</div>
        </div>
        <div class="p-3 border-t border-[#2d2d44] text-xs text-[#868e96]">
            <div>Total: <span id="totalTickets">0</span></div>
            <div>Showing: <span id="filteredCount">0</span></div>
        </div>
    </div>
    
    <div class="flex-1 flex flex-col overflow-hidden">
        <div class="header p-3 border-b border-[#2d2d44] flex justify-between items-center">
            <div class="flex items-center gap-2">
                <h2 class="text-base font-semibold" id="viewTitle">All Tickets</h2>
                <button id="filterOpenBtn" class="btn btn-secondary btn-sm" onclick="toggleOpenFilter()">
                    <i class="fas fa-filter mr-1"></i>Open Only
                </button>
            </div>
            <div class="flex gap-2">
                <button class="btn btn-secondary btn-sm" onclick="showView('import')"><i class="fas fa-plus mr-1"></i>Import</button>
                <button class="btn btn-primary btn-sm" onclick="showView('generate')"><i class="fas fa-file-export mr-1"></i>Generate</button>
            </div>
        </div>
        
        <div class="flex-1 overflow-auto p-2" id="mainContent"></div>
    </div>
    
    <div id="toast" class="toast">Message</div>

    <script>
        const STATUS_COLORS = {{ STATUS_COLORS | safe }};
        const SEVERITY_COLORS = {{ SEVERITY_COLORS | safe }};
        const ENV_COLORS = {{ ENV_COLORS | safe }};
        const ISSUE_COLORS = {{ ISSUE_COLORS | safe }};
        
        let currentView = 'tickets';
        let db = {{ db | tojson }};
        let projects = {{ projects | tojson }};
        let presets = {{ presets | tojson }};
        let currentFmt = {{ current_fmt | tojson }};
        
        let currentProjectFilter = 'all';
        let showOpenOnly = false;
        let openFilterCriteria = {{ db._settings.openFilterCriteria if db._settings else [] }};
        
        const defaultColumns = [
            { key: 'Sn', label: '#', width: 40 },
            { key: 'ID', label: 'ID', width: 110 },
            { key: 'Title', label: 'Title', width: 180 },
            { key: 'Issue Type', label: 'Type', width: 80 },
            { key: 'Status', label: 'Status', width: 90 },
            { key: 'Environment', label: 'Env', width: 55 },
            { key: 'ETA', label: 'ETA', width: 65 },
            { key: 'Severity', label: 'Sev', width: 55 },
            { key: 'Owner', label: 'Owner', width: 90 }
        ];
        
        let columns = JSON.parse(localStorage.getItem('ticketColumns')) || defaultColumns;
        let columnFilters = {};
        let resizingCol = null, startX = 0, startWidth = 0;
        
        function getColor(type, value) {
            const colors = { status: STATUS_COLORS, severity: SEVERITY_COLORS, env: ENV_COLORS, issue: ISSUE_COLORS }[type] || {};
            const vl = (value || '').toLowerCase();
            for (const [k, v] of Object.entries(colors)) { if (vl.includes(k)) return v; }
            return '#e9ecef';
        }
        
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        
        function showView(view) {
            currentView = view;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-view="${view}"]`)?.classList.add('active');
            const titles = { tickets: 'All Tickets', import: 'Import', generate: 'Generate', gsheet: 'Projects', rawpaste: 'Raw Data', settings: 'Settings' };
            document.getElementById('viewTitle').textContent = titles[view] || view;
            renderView(view);
        }
        
        document.querySelectorAll('.nav-item').forEach(el => el.addEventListener('click', () => showView(el.dataset.view)));
        
        function renderView(view) {
            const container = document.getElementById('mainContent');
            switch(view) {
                case 'tickets': renderTickets(container); break;
                case 'import': renderImport(container); break;
                case 'generate': renderGenerate(container); break;
                case 'gsheet': renderProjects(container); break;
                case 'rawpaste': renderRawPaste(container); break;
                case 'settings': renderSettings(container); break;
            }
        }
        
        function isOpenTicket(ticket) {
            if (!openFilterCriteria || !openFilterCriteria.length) {
                const openStatuses = ['open', 'se-wip', 'l1-wip', 'l2', 'l3', 'l3-wip', 'tm to assign', 'need info', 'need info from client'];
                return openStatuses.includes((ticket.Status || '').toLowerCase());
            }
            for (const crit of openFilterCriteria) {
                const val = (ticket[crit.field] || '').toLowerCase();
                const critVal = (crit.value || '').toLowerCase();
                if (crit.operator === 'contains' && val.includes(critVal)) return true;
                if (crit.operator === 'equals' && val === critVal) return true;
                if (crit.operator === 'not_equals' && val !== critVal) return true;
                if (crit.operator === 'empty' && !val) return true;
                if (crit.operator === 'not_empty' && val) return true;
            }
            return false;
        }
        
        function toggleOpenFilter() {
            showOpenOnly = !showOpenOnly;
            const btn = document.getElementById('filterOpenBtn');
            btn.classList.toggle('active', showOpenOnly);
            btn.style.background = showOpenOnly ? 'var(--accent)' : '';
            btn.style.color = showOpenOnly ? 'white' : '';
            renderTickets(document.getElementById('mainContent'));
        }
        
        function renderTickets(container) {
            const allTickets = Object.entries(db).filter(([k]) => !k.startsWith('_')).map(([id, d]) => ({id, ...d}));
            
            let filtered = currentProjectFilter === 'all' ? allTickets : allTickets.filter(t => (t.Project || 'default').toLowerCase() === currentProjectFilter);
            
            if (showOpenOnly) filtered = filtered.filter(isOpenTicket);
            
            for (const [key, vals] of Object.entries(columnFilters)) {
                if (vals && vals.length > 0) {
                    filtered = filtered.filter(t => vals.includes((t[key] || '').toLowerCase()) || (!t[key] && vals.includes('')));
                }
            }
            
            const projectTabs = ['all', ...new Set(allTickets.map(t => (t.Project || 'default').toLowerCase()))];
            
            let html = `
                <div class="flex gap-1 mb-2 border-b border-[#2d2d44] pb-2 overflow-x-auto">
                    ${projectTabs.map(p => `
                        <button class="tab-btn ${currentProjectFilter === p ? 'active' : ''}" onclick="filterByProject('${p}')">
                            ${p === 'all' ? 'All' : p} <i class="fas fa-edit text-[10px] ml-1" onclick="event.stopPropagation(); renameProject('${p}')"></i>
                        </button>
                    `).join('')}
                </div>
                <div class="filter-row">
                    ${columns.filter(c => c.key !== 'Sn').map(col => `
                        <div class="filter-dropdown">
                            <button class="btn btn-secondary btn-sm" style="min-width:${col.width}px">
                                ${col.label} ${columnFilters[col.key]?.length ? `(${columnFilters[col.key].length})` : ''} <i class="fas fa-caret-down ml-1"></i>
                            </button>
                            <div class="filter-dropdown-content">
                                ${getUniqueValues(col.key).map(v => `
                                    <label class="filter-option">
                                        <input type="checkbox" ${(columnFilters[col.key] || []).includes(v) ? 'checked' : ''} 
                                            onchange="toggleFilter('${col.key}', '${v}', this.checked)">
                                        ${v || '(empty)'}
                                    </label>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                    <button class="btn btn-secondary btn-sm ml-2" onclick="clearFilters()">Clear</button>
                </div>
            `;
            
            if (!filtered.length) {
                html += '<div class="text-center text-[#868e96] py-8">No tickets found</div>';
            } else {
                html += `<table class="ticket-table"><thead><tr>`;
                html += columns.map(col => `
                    <th style="width:${col.width}px" onmousedown="startResize(event, '${col.key}')">
                        ${col.label}
                        <div class="resize-handle"></div>
                    </th>
                `).join('');
                html += `</tr></thead><tbody>`;
                html += filtered.map((t, i) => `
                    <tr onclick="editTicket('${t.id}')" style="cursor:pointer">
                        ${columns.map(col => {
                            if (col.key === 'Sn') return `<td>${i+1}</td>`;
                            if (col.key === 'ID') return `<td style="color:#da77f2;font-family:monospace">${t.id}</td>`;
                            if (col.key === 'Status') return `<td><span class="badge" style="background:${getColor('status', t.Status)}20;color:${getColor('status', t.Status)}">${t.Status || '-'}</span></td>`;
                            if (col.key === 'Issue Type') return `<td><span class="badge" style="background:${getColor('issue', t['Issue Type'])}20;color:${getColor('issue', t['Issue Type'])}">${t['Issue Type'] || '-'}</span></td>`;
                            if (col.key === 'Environment') return `<td style="color:${getColor('env', t.Environment)};font-weight:600">${t.Environment || ''}</td>`;
                            if (col.key === 'Severity') return `<td style="color:${getColor('severity', t.Severity)}">${t.Severity || ''}</td>`;
                            return `<td>${(t[col.key] || '').toString().replace(/"/g, '')}</td>`;
                        }).join('')}
                    </tr>
                `).join('');
                html += '</tbody></table>';
            }
            
            container.innerHTML = html;
            document.getElementById('totalTickets').textContent = allTickets.length;
            document.getElementById('filteredCount').textContent = filtered.length;
        }
        
        function getUniqueValues(key) {
            const allTickets = Object.entries(db).filter(([k]) => !k.startsWith('_')).map(([id, d]) => ({id, ...d}));
            const values = [...new Set(allTickets.map(t => (t[key] || '').toLowerCase()))];
            return values.sort();
        }
        
        function toggleFilter(key, value, checked) {
            if (!columnFilters[key]) columnFilters[key] = [];
            if (checked) {
                if (!columnFilters[key].includes(value)) columnFilters[key].push(value);
            } else {
                columnFilters[key] = columnFilters[key].filter(v => v !== value);
            }
            renderTickets(document.getElementById('mainContent'));
        }
        
        function clearFilters() {
            columnFilters = {};
            renderTickets(document.getElementById('mainContent'));
        }
        
        function filterByProject(project) {
            currentProjectFilter = project;
            renderTickets(document.getElementById('mainContent'));
        }
        
        function startResize(e, key) {
            if (e.target.classList.contains('resize-handle')) {
                resizingCol = key;
                startX = e.clientX;
                const col = columns.find(c => c.key === key);
                startWidth = col ? col.width : 100;
                document.addEventListener('mousemove', doResize);
                document.addEventListener('mouseup', stopResize);
            }
        }
        
        function doResize(e) {
            if (resizingCol) {
                const col = columns.find(c => c.key === resizingCol);
                if (col) {
                    col.width = Math.max(40, startWidth + e.clientX - startX);
                    localStorage.setItem('ticketColumns', JSON.stringify(columns));
                    renderTickets(document.getElementById('mainContent'));
                }
            }
        }
        
        function stopResize() {
            resizingCol = null;
            document.removeEventListener('mousemove', doResize);
            document.removeEventListener('mouseup', stopResize);
        }
        
        function renderProjects(container) {
            const allTickets = Object.entries(db).filter(([k]) => !k.startsWith('_')).map(([id, d]) => ({id, ...d}));
            const projList = [...new Set(allTickets.map(t => t.Project || 'default'))];
            
            container.innerHTML = `
                <div class="max-w-xl mx-auto">
                    <div class="bg-[#111827] rounded-lg p-4">
                        <h3 class="text-sm font-semibold mb-3"><i class="fas fa-folder mr-2"></i>Projects</h3>
                        <div class="space-y-2">
                            ${projList.map(p => `
                                <div class="flex gap-2 items-center bg-[#1a1a2e] p-3 rounded">
                                    <i class="fas fa-folder text-[#da77f2]"></i>
                                    <span class="flex-1 font-medium">${p}</span>
                                    <button class="btn btn-secondary btn-sm" onclick="renameProject('${p}')"><i class="fas fa-edit"></i> Rename</button>
                                    <button class="btn btn-secondary btn-sm text-red-400" onclick="deleteProject('${p}')"><i class="fas fa-trash"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }
        
        function renderRawPaste(container) {
            container.innerHTML = `
                <div class="max-w-2xl mx-auto">
                    <div class="bg-[#111827] rounded-lg p-4">
                        <h3 class="text-sm font-semibold mb-3"><i class="fas fa-paste mr-2"></i>Raw Data Paste</h3>
                        <p class="text-xs text-[#868e96] mb-3">Paste text containing ticket IDs. Each ticket ID will be found and updated with extracted info.</p>
                        <div class="space-y-3">
                            <div><label class="block text-xs text-[#868e96] mb-1">Paste your data here</label>
                                <textarea id="rawDataInput" class="input w-full h-64" placeholder="Paste text with ticket IDs like WOTASD-123, statuses, env, etc..."></textarea>
                            </div>
                            <button class="btn btn-primary w-full" onclick="processRawData()"><i class="fas fa-bolt mr-2"></i>Process & Update</button>
                            <div id="rawPasteResults" class="text-xs text-[#868e96] mt-2"></div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        async function processRawData() {
            const text = document.getElementById('rawDataInput').value;
            if (!text) return showToast('Paste some data first');
            
            const ticketIds = [...new Set(text.match(/[A-Z]+-\d+/gi) || [])];
            if (!ticketIds.length) return showToast('No ticket IDs found');
            
            let updated = 0, found = 0;
            for (const tid of ticketIds) {
                const ticketId = tid.toUpperCase();
                if (db[ticketId]) {
                    found++;
                    let updates = {};
                    
                    const statusMatch = text.match(new RegExp(ticketId + '.*?(open|closed|resolved|done|se-wip|l1-wip|l2|l3|need info)', 'i'));
                    if (statusMatch) updates.Status = statusMatch[1];
                    
                    const envMatch = text.match(new RegExp(ticketId + '.*?(STG|staging|prod|live|production|TBD)', 'i'));
                    if (envMatch) updates.Environment = envMatch[1].toUpperCase().replace('STAGING', 'STG').replace('PRODUCTION', 'PROD').replace('LIVE', 'PROD');
                    
                    const etaMatch = text.match(new RegExp(ticketId + '.*?(\\d{1,2}[/-]\\d{1,2}[/-]\\d{2,4}|\\d{4}[/-]\\d{1,2}[/-]\\d{1,2})', 'i'));
                    if (etaMatch) updates.ETA = etaMatch[1];
                    
                    const issueMatch = text.match(new RegExp(ticketId + '.*?(bug|feature|enhancement|hotfix|documentation)', 'i'));
                    if (issueMatch) updates['Issue Type'] = issueMatch[1].charAt(0).toUpperCase() + issueMatch[1].slice(1);
                    
                    if (Object.keys(updates).length) {
                        await fetch(`/api/ticket/${ticketId}`, {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(updates)
                        });
                        updated++;
                    }
                }
            }
            
            document.getElementById('rawPasteResults').innerHTML = `Found ${found} tickets, updated ${updated}`;
            showToast(`Found ${found} tickets, updated ${updated}`);
            if (updated > 0) setTimeout(() => location.reload(), 1500);
        }
        
        function renameProject(pid) {
            const newName = prompt('Enter new project name:', pid);
            if (newName && newName.trim() && newName !== pid) {
                fetch('/api/project/rename', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ old: pid, new: newName.trim() })
                }).then(() => location.reload());
            }
        }
        
        async function deleteProject(pid) {
            if (confirm(`Delete project "${pid}" and all its tickets?`)) {
                const res = await fetch(`/api/project/${pid}`, { method: 'DELETE' });
                const data = await res.json();
                showToast(`Deleted ${data.deleted} tickets`);
                setTimeout(() => location.reload(), 1000);
            }
        }
        
        function renderImport(container) {
            container.innerHTML = `
                <div class="max-w-xl mx-auto space-y-4">
                    <div class="bg-[#111827] rounded-lg p-4">
                        <h3 class="text-sm font-semibold mb-3"><i class="fas fa-file-csv mr-2"></i>Import from File</h3>
                        <div class="space-y-3">
                            <div><label class="block text-xs text-[#868e96] mb-1">Project Name</label><input type="text" id="importProject" class="input w-full" placeholder="default"></div>
                            <div><label class="block text-xs text-[#868e96] mb-1">CSV/Excel File</label><input type="file" id="importFile" accept=".csv,.xlsx,.xls" class="input w-full"></div>
                            <button class="btn btn-primary w-full" onclick="doImport()"><i class="fas fa-upload mr-2"></i>Import</button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        async function doImport() {
            const file = document.getElementById('importFile').files[0];
            if (!file) return showToast('Select a file');
            const formData = new FormData();
            formData.append('file', file);
            formData.append('project', document.getElementById('importProject').value || 'default');
            const res = await fetch('/api/import', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                showToast(`Imported ${data.imported}, updated ${data.updated}`);
                location.reload();
            } else {
                showToast(data.error);
            }
        }
        
        function renderGenerate(container) {
            container.innerHTML = `
                <div class="max-w-xl mx-auto">
                    <div class="bg-[#111827] rounded-lg p-4">
                        <h3 class="text-sm font-semibold mb-3"><i class="fas fa-cog mr-2"></i>Generate Report</h3>
                        <div class="space-y-3">
                            <div><label class="block text-xs text-[#868e96] mb-1">Format</label>
                                <select id="pptFormat" class="input w-full">
                                    ${presets.map(p => `<option value="${p}" ${p === currentFmt ? 'selected' : ''}>${p}</option>`).join('')}
                                    <option value="custom">Custom</option>
                                </select>
                            </div>
                            <div id="customFormatDiv" style="display:none"><input type="text" id="customFormat" class="input w-full" value="[Sn]. [ID] | [Title] | [Status]"></div>
                            <div><label class="block text-xs text-[#868e96] mb-1">Project</label>
                                <select id="projectFilter" class="input w-full">
                                    <option value="all">All</option>
                                    ${projects.map(p => `<option value="${p.id}">${p.label}</option>`).join('')}
                                </select>
                            </div>
                            <div><label class="block text-xs text-[#868e96] mb-1">Title</label><input type="text" id="reportTitle" class="input w-full" value="Ticket Status Report"></div>
                            <label class="flex items-center gap-2 text-xs"><input type="checkbox" id="includeHtml" checked> HTML</label>
                            <label class="flex items-center gap-2 text-xs"><input type="checkbox" id="includePlain" checked> Plain</label>
                            <button class="btn btn-primary w-full" onclick="generatePpt()">Generate</button>
                            <div id="downloadLinks" class="space-y-2 mt-3"></div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('pptFormat').addEventListener('change', (e) => {
                document.getElementById('customFormatDiv').style.display = e.target.value === 'custom' ? 'block' : 'none';
            });
        }
        
        async function generatePpt() {
            const tickets = Object.entries(db).filter(([k]) => !k.startsWith('_')).map(([id, d]) => ({id, ...d}));
            const res = await fetch('/api/generate/ppt', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    format: document.getElementById('pptFormat').value,
                    custom_format: document.getElementById('customFormat').value,
                    project: document.getElementById('projectFilter').value,
                    title: document.getElementById('reportTitle').value,
                    html: document.getElementById('includeHtml').checked,
                    plain: document.getElementById('includePlain').checked, tickets
                })
            });
            const data = await res.json();
            if (data.success) {
                showToast(`Generated ${data.lines} tickets`);
                let links = '';
                if (data.html_file) links += `<a href="/api/download/html" class="btn btn-secondary block text-center text-xs">HTML</a>`;
                if (data.plain_file) links += `<a href="/api/download/plain" class="btn btn-secondary block text-center text-xs">Text</a>`;
                if (data.html_all_file) links += `<a href="/api/download/all" class="btn btn-secondary block text-center text-xs">All</a>`;
                document.getElementById('downloadLinks').innerHTML = links;
            }
        }
        
        function renderSettings(container) {
            openFilterCriteria = openFilterCriteria || [];
            
            container.innerHTML = `
                <div class="max-w-xl mx-auto space-y-4">
                    <div class="bg-[#111827] rounded-lg p-4">
                        <h3 class="text-sm font-semibold mb-3"><i class="fas fa-filter mr-2"></i>Open Ticket Criteria</h3>
                        <div class="space-y-2 mb-3" id="criteriaList">
                            ${openFilterCriteria.map((c, i) => `
                                <div class="flex gap-2 items-center">
                                    <select class="input text-xs" id="field_${i}">
                                        <option value="Status" ${c.field==='Status'?'selected':''}>Status</option>
                                        <option value="Severity" ${c.field==='Severity'?'selected':''}>Severity</option>
                                        <option value="Issue Type" ${c.field==='Issue Type'?'selected':''}>Issue Type</option>
                                        <option value="Environment" ${c.field==='Environment'?'selected':''}>Environment</option>
                                        <option value="Owner" ${c.field==='Owner'?'selected':''}>Owner</option>
                                    </select>
                                    <select class="input text-xs" id="op_${i}">
                                        <option value="contains" ${c.operator==='contains'?'selected':''}>contains</option>
                                        <option value="equals" ${c.operator==='equals'?'selected':''}>equals</option>
                                        <option value="not_equals" ${c.operator==='not_equals'?'selected':''}>not equals</option>
                                        <option value="empty" ${c.operator==='empty'?'selected':''}>is empty</option>
                                        <option value="not_empty" ${c.operator==='not_empty'?'selected':''}>is not empty</option>
                                    </select>
                                    <input type="text" class="input text-xs" id="val_${i}" value="${c.value || ''}" placeholder="value">
                                    <button class="btn btn-secondary btn-sm" onclick="removeCriteria(${i})"><i class="fas fa-times"></i></button>
                                </div>
                            `).join('')}
                        </div>
                        <div class="flex gap-2">
                            <button class="btn btn-secondary btn-sm" onclick="addCriteria()">+ Add</button>
                            <button class="btn btn-primary btn-sm" onclick="saveCriteria()">Save</button>
                        </div>
                    </div>
                    <div class="bg-[#111827] rounded-lg p-4">
                        <h3 class="text-sm font-semibold mb-3"><i class="fas fa-cog mr-2"></i>Settings</h3>
                        <div class="space-y-3">
                            <div><label class="block text-xs text-[#868e96] mb-1">Default Format</label>
                                <select id="defaultFmt" class="input w-full" onchange="saveSettings()">
                                    ${presets.map(p => `<option value="${p}" ${p === currentFmt ? 'selected' : ''}>${p}</option>`).join('')}
                                </select>
                            </div>
                            <button class="btn btn-secondary" onclick="clearDb()"><i class="fas fa-trash mr-2"></i>Clear All</button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function addCriteria() {
            openFilterCriteria.push({ field: 'Status', operator: 'contains', value: '' });
            renderSettings(document.getElementById('mainContent'));
        }
        
        function removeCriteria(i) {
            openFilterCriteria.splice(i, 1);
            renderSettings(document.getElementById('mainContent'));
        }
        
        async function saveCriteria() {
            const criteria = [];
            document.querySelectorAll('#criteriaList > div').forEach((_, i) => {
                criteria.push({
                    field: document.getElementById(`field_${i}`).value,
                    operator: document.getElementById(`op_${i}`).value,
                    value: document.getElementById(`val_${i}`).value
                });
            });
            openFilterCriteria = criteria;
            await fetch('/api/settings', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ openFilterCriteria: criteria })
            });
            showToast('Saved');
        }
        
        async function saveSettings() {
            await fetch('/api/settings', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ ppt_format: document.getElementById('defaultFmt').value })
            });
            showToast('Saved');
        }
        
        async function clearDb() {
            if (confirm('Clear all data?')) {
                for (const id of Object.keys(db).filter(k => !k.startsWith('_'))) {
                    await fetch(`/api/ticket/${id}`, { method: 'DELETE' });
                }
                location.reload();
            }
        }
        
        function editTicket(id) {
            const t = db[id];
            if (!t) return;
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="max-w-xl mx-auto">
                    <div class="bg-[#111827] rounded-lg p-4">
                        <h3 class="text-sm font-semibold mb-3">Edit: ${id}</h3>
                        <div class="space-y-2">
                            <div><label class="block text-xs text-[#868e96] mb-1">Title</label><input type="text" id="editTitle" class="input w-full" value="${(t.Title || '').replace(/"/g, '&quot;')}"></div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="block text-xs text-[#868e96] mb-1">Status</label><input type="text" id="editStatus" class="input w-full" value="${t.Status || ''}"></div>
                                <div><label class="block text-xs text-[#868e96] mb-1">Issue Type</label><input type="text" id="editType" class="input w-full" value="${t['Issue Type'] || ''}"></div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="block text-xs text-[#868e96] mb-1">Environment</label><input type="text" id="editEnv" class="input w-full" value="${t.Environment || ''}"></div>
                                <div><label class="block text-xs text-[#868e96] mb-1">ETA</label><input type="text" id="editEta" class="input w-full" value="${t.ETA || ''}"></div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="block text-xs text-[#868e96] mb-1">Severity</label><input type="text" id="editSev" class="input w-full" value="${t.Severity || ''}"></div>
                                <div><label class="block text-xs text-[#868e96] mb-1">Owner</label><input type="text" id="editOwner" class="input w-full" value="${t.Owner || ''}"></div>
                            </div>
                            <div><label class="block text-xs text-[#868e96] mb-1">Text Snippet</label>
                                <textarea id="editSnippet" class="input w-full h-16" placeholder="Paste text to auto-extract env, eta, type..." oninput="extractFromSnippet(this.value)"></textarea>
                            </div>
                            <div class="flex gap-2 mt-3">
                                <button class="btn btn-primary" onclick="saveTicket('${id}')">Save</button>
                                <button class="btn btn-secondary" onclick="showView('tickets')">Cancel</button>
                                <button class="btn btn-secondary text-red-400" onclick="deleteTicket('${id}')">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function extractFromSnippet(text) {
            const envMatch = text.match(/(STG|staging|prod|live|production|TBD)/i);
            const etaMatch = text.match(/(\d{1,2}[/-]\d{1,2}[/-]\d{2,4}|\d{4}[/-]\d{1,2}[/-]\d{1,2})/);
            const issueMatch = text.match(/(bug|feature|enhancement|hotfix|documentation)/i);
            if (envMatch) document.getElementById('editEnv').value = envMatch[1].toUpperCase().replace('STAGING', 'STG').replace('PRODUCTION', 'PROD').replace('LIVE', 'PROD');
            if (etaMatch) document.getElementById('editEta').value = etaMatch[1];
            if (issueMatch) document.getElementById('editType').value = issueMatch[1].charAt(0).toUpperCase() + issueMatch[1].slice(1);
        }
        
        async function saveTicket(id) {
            await fetch(`/api/ticket/${id}`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    Title: document.getElementById('editTitle').value,
                    Status: document.getElementById('editStatus').value,
                    'Issue Type': document.getElementById('editType').value,
                    Environment: document.getElementById('editEnv').value,
                    ETA: document.getElementById('editEta').value,
                    Severity: document.getElementById('editSev').value,
                    Owner: document.getElementById('editOwner').value
                })
            });
            showToast('Saved');
            location.reload();
        }
        
        async function deleteTicket(id) {
            if (confirm('Delete?')) {
                await fetch(`/api/ticket/${id}`, { method: 'DELETE' });
                location.reload();
            }
        }
        
        showView('tickets');
    </script>
</body>
</html>
